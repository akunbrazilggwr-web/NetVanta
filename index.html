<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NetVanta 1.0.0</title>
  <meta name="description" content="NetVanta network diagnostic and security testing dashboard.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-tools">
        <button class="icon-btn start" id="startBtn" title="Mulai"><img src="https://cdn.phototourl.com/member/2026-10-02-b8345b08-8b9c-46be-99aa-ab2516f6816b.png" alt="Start"></button>
        <button class="icon-btn stop" id="stopBtn" title="Jeda/Stop"><img src="https://cdn.phototourl.com/member/2026-10-02-6f5c4601-f4c8-4452-a047-5ebbd9b48668.png" alt="Stop"></button>
      </div>
      <div class="title"><strong>NetVanta</strong><span>1.0.0</span></div>
      <div class="device"><div><b>Nama device digunakan</b><span id="deviceName">Mendeteksi...</span></div><div><b>Nama OS yang di gunakan</b><span id="osName">Mendeteksi...</span></div></div>
    </header>

    <section class="workspace">
      <div class="left">
        <div class="target-row"><input id="target" autocomplete="off" placeholder="Masukkan URL atau IP / IP:PORT"></div>
        <div class="mode-grid">
          <button class="mode" data-mode="resolve"><img src="https://cdn.phototourl.com/member/2026-10-02-3f5160fc-d43f-430b-b90f-0418203f0f3a.png"><span>Cek IP website</span></button>
          <button class="mode" data-mode="server-ip"><img src="https://cdn.phototourl.com/member/2026-10-02-a92371a2-1038-4314-9b85-85e15139f69a.png"><span>Scan Server IP</span></button>
          <button class="mode" data-mode="port-scan"><img src="https://cdn.phototourl.com/member/2026-10-02-66d48683-e948-49f6-92ed-1a1c74f0e476.png"><span>Cek Open Port</span></button>
          <button class="mode" data-mode="wifi-scan"><img src="https://cdn.phototourl.com/member/2026-10-02-616947fb-6768-4e1b-86ee-f1b6bcf5e95f.png"><span>Scan WiFi</span></button>
          <button class="mode" data-mode="traffic"><img src="https://cdn.phototourl.com/member/2026-10-02-2826fcc4-12e9-4ced-8922-3b474a4a7298.png"><span>Cek Network Traffic</span></button>
          <button class="mode coming" data-mode="special"><img src="https://cdn.phototourl.com/member/2026-10-02-89e6bb5c-3c72-4494-8ed0-a94638536119.png"><span>Special IP Scan</span></button>
        </div>
        <div class="result-box"><div class="result-title">Hasil scan IP server dan WiFi scan</div><pre id="result">Siap. Isi target, pilih fitur, lalu tekan Start.</pre></div>
      </div>

      <aside class="right">
        <div class="result-tabs"><button class="tab active">Hasil cek IP web</button><button class="tab">Hasil scan port dan scan pake IP khusus</button></div>
        <div class="terminal"><div class="terminal-head"><span id="statusDot"></span><span id="terminalTitle">Terminal NetVanta</span></div><pre id="terminalOutput">NetVanta 1.0.0\nReady. Menunggu mode scan.</pre></div>
      </aside>
    </section>
  </main>
  <div class="modal hidden" id="modal"><div class="modal-card"><h2 id="modalTitle">Peringatan</h2><p id="modalText"></p><button id="modalClose">Tutup</button></div></div>
  <script src="/app.js"></script>
</body>
</html>
